name: Mutation testing

# Mutates the hand-written code: the package core and the generator (about 4,000 mutants, two
# hours), so it runs nightly and on demand instead of on every pull request. Generated classes are
# left out: their faults come from the emitters, which are mutated (PLAN.md, Phase 4 step 7).

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  mutation:
    runs-on: ubuntu-latest
    name: Mutation testing (${{ matrix.scope }}, ${{ matrix.blocking && '100%' || 'report only' }})
    timeout-minutes: 240

    # The package core must stay at 100%: a red core job fails the run, which blocks pull requests
    # through the CI check. The generator job only reports: its output is pinned by the emitter
    # tests, the drift check and the hydration and contract tests against recorded responses.
    continue-on-error: ${{ ! matrix.blocking }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - scope: core
            blocking: true
          - scope: generator
            blocking: false

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          extensions: dom, curl, libxml, mbstring, zip
          coverage: pcov
          ini-values: pcov.directory=., pcov.exclude="~(vendor|tests)~"

      - name: Install dependencies
        run: composer update --prefer-stable --prefer-dist --no-interaction

      - name: Mutation testing
        run: php generator/bin/mutate --scope=${{ matrix.scope }}
