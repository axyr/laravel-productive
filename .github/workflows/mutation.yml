name: Mutation testing

# Mutates the package core (src/) nightly and on demand, at a 100% gate that blocks pull requests
# through the CI check. The files are split over six jobs that run side by side, balanced by the
# seconds each file took (generator/config/mutation-weights.php): about half an hour instead of an
# hour, bounded by the config, which most tests cover. The run succeeds only when every shard does.
# The generator is not part of the nightly: its output is pinned by the emitter tests, the drift
# check, and the input-schema, spec-consistency and hydration tests. A pull request mutates the
# files it changes, generator included, in CI ("Mutation testing of the changed files").

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  mutation:
    runs-on: ubuntu-latest
    name: Mutation testing (core, shard ${{ matrix.shard }}/6, 100%)
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          extensions: dom, curl, libxml, mbstring, zip
          coverage: pcov
          ini-values: pcov.directory=., pcov.exclude="~(vendor|tests)~"

      - name: Install dependencies
        run: composer update --prefer-stable --prefer-dist --no-interaction

      - name: Mutation testing
        run: php generator/bin/mutate --scope=core --shard=${{ matrix.shard }}/6
