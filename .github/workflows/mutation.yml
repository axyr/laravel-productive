name: Mutation testing

# Mutates the package core (src/, about an hour) nightly and on demand, at a 100% gate that blocks
# pull requests through the CI check. The generator is not part of the nightly: its output is pinned
# by the emitter tests, the drift check, and the input-schema, spec-consistency and hydration tests.
# Mutate it by hand when changing it: `composer test:mutate -- --scope=generator` (PLAN.md, step 7).

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  mutation:
    runs-on: ubuntu-latest
    name: Mutation testing (core, 100%)
    timeout-minutes: 240

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          extensions: dom, curl, libxml, mbstring, zip
          coverage: pcov
          ini-values: pcov.directory=., pcov.exclude="~(vendor|tests)~"

      - name: Install dependencies
        run: composer update --prefer-stable --prefer-dist --no-interaction

      - name: Mutation testing
        run: php generator/bin/mutate --scope=core
