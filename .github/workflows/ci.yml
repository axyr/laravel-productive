name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  nightly-mutation:
    runs-on: ubuntu-latest
    name: Nightly mutation testing is green
    permissions:
      actions: read

    # Mutation testing runs nightly (it takes over an hour). A red nightly run on main blocks
    # merging until it is fixed, so the 100% gate keeps its meaning.
    steps:
      - name: Check the latest nightly run on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          conclusion=$(gh run list --repo "${{ github.repository }}" --workflow mutation.yml --branch main --status completed --limit 1 --json conclusion --jq '.[0].conclusion // "none"')
          echo "Latest nightly mutation run: $conclusion"
          if [ "$conclusion" = "failure" ]; then
            echo "::error::The latest nightly mutation run on main failed. Fix the surviving mutants before merging."
            exit 1
          fi

  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [8.3, 8.4, 8.5]
        laravel: [12, 13]
        stability: [prefer-lowest, prefer-stable]

    name: Tests - PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }} (${{ matrix.stability }})

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip
          coverage: none

      - name: Install dependencies
        run: |
          composer require "illuminate/support:^${{ matrix.laravel }}.0" --no-update --no-interaction
          composer update --${{ matrix.stability }} --prefer-dist --no-interaction

      # The generated-code and API description checks depend on exact inflector output, so they
      # run once in the generated-code job instead of on every dependency set.
      - name: Run tests
        run: vendor/bin/pest --exclude-group=drift

  coverage:
    runs-on: ubuntu-latest
    name: Coverage (line 100%, type 100%)

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          extensions: dom, curl, libxml, mbstring, zip
          coverage: pcov
          ini-values: pcov.directory=., pcov.exclude="~(vendor|tests)~"

      - name: Install dependencies
        run: composer update --prefer-stable --prefer-dist --no-interaction

      - name: Line coverage
        run: vendor/bin/pest --coverage --min=100

      - name: Type coverage
        run: vendor/bin/pest --type-coverage --min=100


  generated-code:
    runs-on: ubuntu-latest
    name: Generated code is up to date

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          extensions: dom, curl, libxml, mbstring, zip
          coverage: none

      - name: Install dependencies
        run: composer update --prefer-stable --prefer-dist --no-interaction

      - name: Check generated code
        run: composer generate:check

      - name: Check the API description
        run: vendor/bin/pest --group=drift

  static-analysis:
    runs-on: ubuntu-latest
    name: Static Analysis

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          extensions: dom, curl, libxml, mbstring, zip
          coverage: none

      - name: Install dependencies
        run: composer update --prefer-stable --prefer-dist --no-interaction

      - name: Run PHPStan
        run: vendor/bin/phpstan analyse

  code-style:
    runs-on: ubuntu-latest
    name: Code Style

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          extensions: dom, curl, libxml, mbstring, zip
          coverage: none

      - name: Install dependencies
        run: composer update --prefer-stable --prefer-dist --no-interaction

      - name: Run Pint
        run: vendor/bin/pint --test

  complexity:
    runs-on: ubuntu-latest
    name: Complexity Analysis

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          extensions: dom, curl, libxml, mbstring, zip
          coverage: none

      - name: Install dependencies
        run: composer update --prefer-stable --prefer-dist --no-interaction

      - name: Run PHPMD
        run: php -d error_reporting='E_ALL & ~E_DEPRECATED' vendor/bin/phpmd src,generator/src text phpmd.xml
